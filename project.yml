name: DDF
options:
  bundleIdPrefix: de.ddf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  DDF:
    type: application
    platform: iOS
    sources:
      - path: DDF
    info:
      path: DDF/App/Info.plist
      properties:
        CFBundleDisplayName: Jiggl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.ddf.derduemmstefliegt
        PRODUCT_NAME: DDF
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Jiggl
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  DDFTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DDFTests
    dependencies:
      - target: DDF
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.ddf.derduemmstefliegt.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DDF:
    build:
      targets:
        DDF: all
        DDFTests: [test]
    test:
      targets:
        - DDFTests
